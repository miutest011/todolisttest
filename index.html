<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>我的待办清单</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>我的待办清单</h1>

<div id="app"></div>

<script src="app.js"></script>
<script>
  // 把整个应用挂到 #app 这个元素上，开始运行
  initApp(document.getElementById('app'));

  // 启动提醒检查（每分钟看一遍有没有任务到点了）
  startReminderTimer();
</script>

</body>
</html>
