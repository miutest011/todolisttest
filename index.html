<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<!-- 手机上按屏幕真实宽度渲染。没有这一行，iPhone 会当成电脑屏幕、把整页缩小。
     maximum-scale=1 和 user-scalable=no 是不让页面缩放：这是个 App，页面和屏幕一样大才对。
     另外两种"不小心放大"在别处处理：输入框字号（style.css 的 --text-input）、连点两下（style.css 的 touch-action） -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>我的待办清单</title>

<!-- PWA：让它能被"添加到主屏幕"，装出来像个 App -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<!-- 下面几行是 iPhone 专用的，Safari 不认 manifest 里的部分设置 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="待办">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 标题由各个标签页自己渲染（"清单"页和"今天"页标题不同），
     所以这里只留一个挂载点 -->
<div id="app"></div>

<script src="app.js"></script>
<!-- 标签界面（顶部标签行、长按管理）清单页和打卡页共用，放在 tags.js 里。
     打卡功能单独放在 logs.js 里。它们要用前面文件里的工具，所以顺序不能乱。
     新增脚本时记得同时加进 sw.js 的缓存列表（有测试盯着）和 tools/test.html 的 SCRIPTS -->
<script src="tags.js"></script>
<script src="logs.js"></script>
<!-- 装成 iOS 应用时才起作用的一层（提醒交给系统、导出用系统分享）。用浏览器打开时它什么都不做 -->
<script src="native.js"></script>
<script>
  // 把整个应用挂到 #app 这个元素上，开始运行
  initApp(document.getElementById('app'));

  // 启动提醒检查（每分钟看一遍有没有任务到点了）
  startReminderTimer();

  // 拦住 iPhone 上的双指缩放。
  // 苹果为了照顾视力不好的用户，Safari 会无视上面 viewport 里的 user-scalable=no，
  // 只能靠拦截它自己的"手势开始"事件。这个事件只有 iPhone / iPad 的 Safari 有，别的浏览器上这几行什么都不做
  document.addEventListener('gesturestart', (event) => event.preventDefault());

  // 注册 Service Worker，让网页能离线打开。
  // 浏览器只在 https 或者 localhost 下才允许注册，所以用 http 的局域网地址访问时
  // 这一步会被跳过 —— 那种情况下网页照常能用，只是装不成 App、也不能离线
  // 装成 iOS 应用之后网页是从应用自己的地址加载的，那里没有 Service Worker 这回事
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((error) => {
        console.log('Service Worker 没注册成功：', error.message);
      });
    });
  }
</script>

</body>
</html>
